name: Prepare a self-hosted workspace
description: >-
  Run right after actions/checkout with `clean: false`. A self-hosted runner
  reuses its checkout so target/ stays warm; this clears everything else a
  previous job left (untracked and ignored files outside target/, and
  target/dist so a job never uploads an older build), and drops target/ once
  it grows past the limit. Does nothing on GitHub's runners.
inputs:
  target-max-gb:
    description: >-
      Remove target/ when it holds more than this many GB. Empty means the
      runner's KARYA_CI_TARGET_MAX_GB (set in the runner folder's .env), or
      60.
    default: ""
runs:
  using: composite
  steps:
    - if: runner.environment == 'self-hosted'
      shell: bash
      env:
        MAX_GB: ${{ inputs.target-max-gb }}
      run: |
        set -euo pipefail
        MAX_GB="${MAX_GB:-${KARYA_CI_TARGET_MAX_GB:-${MATTY_CI_TARGET_MAX_GB:-60}}}"
        git clean -ffdx -e /target/
        rm -rf target/dist
        if [[ -d target ]]; then
          used_kb="$(du -sk target | cut -f1)"
          echo "target/ holds $((used_kb / 1024 / 1024)) GB (limit ${MAX_GB} GB)"
          if ((used_kb > MAX_GB * 1024 * 1024)); then
            echo "Removing target/ to free disk space; this build starts cold"
            rm -rf target
          fi
        fi
        df -h . | tail -n 1
