name: Rust toolchain
description: >-
  Installs the Rust toolchain the repository pins (the channel in
  rust-toolchain.toml, or another TOML file and key), or the `toolchain`
  input for an MSRV or nightly job, with rustup, plus extra components and
  targets, and makes it the one cargo uses. A rust-toolchain.toml's own
  components and targets are installed too.
inputs:
  file:
    description: The TOML file that pins the toolchain.
    default: rust-toolchain.toml
  key:
    description: The dotted key in that file that holds the toolchain.
    default: toolchain.channel
  toolchain:
    description: A toolchain to use instead of rust-toolchain.toml's channel.
    default: ""
  components:
    description: Extra components, separated by commas or spaces.
    default: ""
  targets:
    description: Extra targets, separated by commas or spaces.
    default: ""
outputs:
  toolchain:
    description: The toolchain that was installed.
    value: ${{ steps.install.outputs.toolchain }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        FILE: ${{ inputs.file }}
        KEY: ${{ inputs.key }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        if [ -z "$TOOLCHAIN" ]; then
          if [ ! -f "$FILE" ]; then
            echo "::error::No $FILE and no toolchain input."
            exit 1
          fi
          # Python 3.9 (macOS's own python3) has no tomllib, so a small
          # reader covers the `key = "value"` and `key = ["a", "b"]` lines
          # toolchain files hold.
          IFS='|' read -r TOOLCHAIN file_components file_targets < <("$(command -v python3 || command -v python)" - "$FILE" "$KEY" <<'PY'
        import re, sys
        path, key = sys.argv[1:]
        try:
            import tomllib
            data = tomllib.load(open(path, "rb"))
        except ImportError:
            data, table = {}, {}
            data_root = data
            for line in open(path):
                line = line.split("#", 1)[0].strip()
                if not line:
                    continue
                m = re.fullmatch(r"\[([^\]]+)\]", line)
                if m:
                    table = data_root
                    for part in m.group(1).strip().split("."):
                        table = table.setdefault(part, {})
                    continue
                k, _, v = (x.strip() for x in line.partition("="))
                table[k] = re.findall(r'"([^"]*)"', v) if v.startswith("[") else v.strip('"')
        *parents, last = key.split(".")
        table = data
        for part in parents:
            table = table[part]
        own = key == "toolchain.channel"
        print(table[last],
              ",".join(table.get("components", [])) if own else "-",
              ",".join(table.get("targets", [])) if own else "-", sep="|")
        PY
          )
          # Windows Python ends lines with \r\n; drop the \r.
          file_targets=${file_targets%$'\r'}
          [ "$file_components" = - ] || COMPONENTS="$COMPONENTS,$file_components"
          [ "$file_targets" = - ] || TARGETS="$TARGETS,$file_targets"
        fi
        # A self-hosted runner's PATH may not hold ~/.cargo/bin even though
        # rustup is there. Reinstalling it then rewrites the cargo and rustc
        # proxies, and another job on the same machine that runs cargo at
        # that moment fails with "Text file busy" (matty#844).
        cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        if ! command -v rustup >/dev/null; then
          if [ ! -x "$cargo_bin/rustup" ] && [ ! -x "$cargo_bin/rustup.exe" ]; then
            curl --proto '=https' --tlsv1.2 -sSf --retry 5 https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$cargo_bin" >>"$GITHUB_PATH"
          export PATH="$cargo_bin:$PATH"
        fi
        args=(--profile minimal --no-self-update)
        for c in ${COMPONENTS//,/ }; do args+=(--component "$c"); done
        for t in ${TARGETS//,/ }; do args+=(--target "$t"); done
        # rustup retries downloads itself; the loop covers a failed index fetch.
        # Jobs on one machine share rustup's home; one install at a time.
        # (macOS has no flock, and no "Text file busy" either.)
        locked() {
          if command -v flock >/dev/null; then
            flock "${RUSTUP_HOME:-$HOME/.rustup}/.karya-install.lock" "$@"
          else
            "$@"
          fi
        }
        for attempt in 1 2 3; do
          locked rustup toolchain install "$TOOLCHAIN" "${args[@]}" && break
          [ "$attempt" = 3 ] && exit 1
          sleep $((attempt * 10))
        done
        # RUSTUP_TOOLCHAIN wins over rust-toolchain.toml, so an MSRV job
        # really builds with the MSRV.
        echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >>"$GITHUB_ENV"
        echo "toolchain=$TOOLCHAIN" >>"$GITHUB_OUTPUT"
        RUSTUP_TOOLCHAIN="$TOOLCHAIN" rustc --version
