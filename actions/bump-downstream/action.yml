name: Bump a downstream pin
description: >-
  After a release, opens (or updates) a pull request in a downstream
  repository that moves its requirement on the crate to the new version, and
  any dependency the release pins newer that the repository also names (such
  as GPUI Kit for a gpuicn release), and updates Cargo.lock, so the
  consumer's own CI checks the release. Needs the
  Karya bot GitHub App (organization secrets KARYA_BOT_APP_ID and
  KARYA_BOT_PRIVATE_KEY); without them it only writes a notice.
inputs:
  repository:
    description: The downstream repository, owner/name.
    required: true
  crate:
    description: The crate that was released, by package name.
    required: true
  version:
    required: true
  toolchain-file:
    description: The downstream file that pins its toolchain.
    default: rust-toolchain.toml
  toolchain-key:
    description: The dotted key in that file.
    default: toolchain.channel
  app-id:
    default: ""
  private-key:
    default: ""
outputs:
  pull-request:
    description: The pull request's URL.
    value: ${{ steps.pr.outputs.url }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        HAS_APP: ${{ inputs.app-id != '' && inputs.private-key != '' }}
        REPOSITORY: ${{ inputs.repository }}
        CRATE: ${{ inputs.crate }}
        VERSION: ${{ inputs.version }}
      run: |
        if [ "$HAS_APP" != true ]; then
          echo "::notice::No Karya bot app configured: open the $REPOSITORY bump to $CRATE $VERSION by hand."
        fi
        echo "enabled=$HAS_APP" >>"$GITHUB_OUTPUT"
        echo "name=${REPOSITORY#*/}" >>"$GITHUB_OUTPUT"
    - id: token
      if: steps.check.outputs.enabled == 'true'
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ steps.check.outputs.name }}
    - if: steps.check.outputs.enabled == 'true'
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        token: ${{ steps.token.outputs.token }}
        # actions/checkout only writes under the workspace.
        path: .karya-bump
    - if: steps.check.outputs.enabled == 'true'
      uses: karyalabs/.github/actions/rust-toolchain@v1
      with:
        file: ${{ format('{0}/.karya-bump/{1}', github.workspace, inputs.toolchain-file) }}
        key: ${{ inputs.toolchain-key }}
    - id: pr
      if: steps.check.outputs.enabled == 'true'
      shell: bash
      working-directory: ${{ format('{0}/.karya-bump', github.workspace) }}
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        APP_SLUG: ${{ steps.token.outputs.app-slug }}
        REPOSITORY: ${{ inputs.repository }}
        CRATE: ${{ inputs.crate }}
        VERSION: ${{ inputs.version }}
        UPSTREAM: ${{ github.repository }}
      run: |
        set -euo pipefail
        # The crates.io index can lag the publish by a minute or two.
        deps="$RUNNER_TEMP/karya-bump-deps.json"
        for attempt in $(seq 1 20); do
          curl -fsS -A "karyalabs-bump-downstream" \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION/dependencies" -o "$deps" && break
          [ "$attempt" = 20 ] && exit 1
          sleep 30
        done
        # Moves the crate, and every dependency it pins that this repository
        # also names, so the two never require different versions.
        python3 "$GITHUB_ACTION_PATH/bump.py" Cargo.toml "$CRATE" "$VERSION" "$deps" >"$RUNNER_TEMP/karya-bump-moved"
        mapfile -t moved <"$RUNNER_TEMP/karya-bump-moved"
        if [ "${#moved[@]}" -gt 0 ]; then
          update=()
          for package in "${moved[@]}"; do update+=(-p "$package"); done
          for attempt in $(seq 1 20); do
            cargo update "${update[@]}" && break
            [ "$attempt" = 20 ] && exit 1
            sleep 30
          done
        fi
        if git diff --quiet; then
          echo "$REPOSITORY already uses $CRATE $VERSION"
          exit 0
        fi
        branch="bump/$CRATE-$VERSION"
        bot_id="$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)"
        git config user.name "$APP_SLUG[bot]"
        git config user.email "$bot_id+$APP_SLUG[bot]@users.noreply.github.com"
        git switch -c "$branch"
        git commit -qam "Update $CRATE to $VERSION"
        git push --force origin "$branch"
        notes="https://github.com/$UPSTREAM/releases/tag/v$VERSION"
        also=""
        for package in "${moved[@]}"; do
          [ "$package" = "$CRATE" ] || also="$also\`$package\` "
        done
        [ -z "$also" ] || also="$(printf '\n\nAlso moves %sto the versions %s %s requires.' "$also" "$CRATE" "$VERSION")"
        body="$(printf 'Moves %s to %s, released by %s.%s\n\nRelease notes: %s\n\nOpened by the release workflow of %s. Merge it once `ci` is green; fix any break here before the next release.\n' \
          "\`$CRATE\`" "$VERSION" "$UPSTREAM" "$also" "$notes" "$UPSTREAM")"
        url="$(gh pr list --repo "$REPOSITORY" --head "$branch" --state open --json url --jq '.[0].url // ""')"
        if [ -z "$url" ]; then
          url="$(gh pr create --repo "$REPOSITORY" --head "$branch" --title "Update $CRATE to $VERSION" --body "$body")"
        fi
        echo "url=$url" >>"$GITHUB_OUTPUT"
        echo "::notice::Bump pull request: $url"
